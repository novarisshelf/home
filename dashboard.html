<!DOCTYPE html>
<html lang="bn">
<head>
  <script>
    try {
      if (localStorage.getItem('novaris_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novaris — অর্ডার ড্যাশবোর্ড</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <script type="module" src="i18n.js"></script>

  <div class="owner-bar">
    <div class="owner-bar-inner">
      <div class="owner-bar-links">
        <a href="dashboard.html" class="active" data-i18n="owner_orders">অর্ডার</a>
        <a href="admin.html" data-i18n="owner_manage_books">বই পরিচালনা</a>
        <a href="admin-decor.html" data-i18n="owner_manage_decor">ডেকর পরিচালনা</a>
      </div>
      <button class="owner-logout" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="owner_logout">লগআউট</span></button>
    </div>
  </div>

  <div class="container">
    <h1 style="margin-top: 24px;" data-i18n="owner_orders_title">অর্ডার ইতিহাস</h1>

    <div class="order-filter-bar" id="order-filter-bar">
      <button type="button" class="order-filter-chip active" data-filter="all" data-i18n="owner_filter_all">সব</button>
      <button type="button" class="order-filter-chip" data-filter="pending" data-i18n="order_status_pending">পেন্ডিং</button>
      <button type="button" class="order-filter-chip" data-filter="confirmed" data-i18n="order_status_confirmed">কনফার্ম</button>
      <button type="button" class="order-filter-chip" data-filter="on_the_way" data-i18n="order_status_on_the_way">পথে আছে</button>
      <button type="button" class="order-filter-chip" data-filter="delivered" data-i18n="order_status_delivered">ডেলিভার্ড</button>
      <button type="button" class="order-filter-chip" data-filter="cancelled" data-i18n="order_status_cancelled">বাতিল</button>
    </div>

    <div id="orders-list">
      <p class="loading-state" data-i18n="orders_loading">অর্ডার লোড হচ্ছে…</p>
    </div>
  </div>

  <div id="site-footer"></div>

  <script type="module">
    import { requireAuth, logoutUser } from './auth.js';
    import { fetchOrders, updateOrder } from './dashboard.js';
    import { t, getLang } from './i18n.js';

    await requireAuth();

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await logoutUser();
      window.location.href = 'login.html';
    });

    const listEl = document.getElementById('orders-list');
    const statusLabels = {
      pending: t('order_status_pending'),
      confirmed: t('order_status_confirmed'),
      on_the_way: t('order_status_on_the_way'),
      delivered: t('order_status_delivered'),
      cancelled: t('order_status_cancelled')
    };

    function formatTime(ts) {
      if (!ts || !ts.toDate) return '';
      return ts.toDate().toLocaleString(getLang() === 'bn' ? 'bn-BD' : 'en-US', { dateStyle: 'medium', timeStyle: 'short' });
    }

    let allOrders = [];
    let currentFilter = 'all';

    function actionButtonsHtml(order) {
      const status = order.status || 'pending';
      if (status === 'pending') {
        return `
          <button type="button" class="btn btn-primary btn-sm action-btn" data-id="${order.id}" data-next="confirmed">
            <i class="fa-solid fa-check"></i> ${t('owner_action_confirm')}
          </button>
          <button type="button" class="btn btn-danger btn-sm action-btn" data-id="${order.id}" data-next="cancelled">
            <i class="fa-solid fa-xmark"></i> ${t('owner_action_cancel')}
          </button>
        `;
      }
      if (status === 'confirmed') {
        return `
          <button type="button" class="btn btn-primary btn-sm action-btn" data-id="${order.id}" data-next="on_the_way">
            <i class="fa-solid fa-truck"></i> ${t('owner_action_on_the_way')}
          </button>
          <button type="button" class="btn btn-danger btn-sm action-btn" data-id="${order.id}" data-next="cancelled">
            <i class="fa-solid fa-xmark"></i> ${t('owner_action_cancel')}
          </button>
        `;
      }
      if (status === 'on_the_way') {
        return `
          <button type="button" class="btn btn-primary btn-sm action-btn" data-id="${order.id}" data-next="delivered">
            <i class="fa-solid fa-box"></i> ${t('owner_action_delivered')}
          </button>
        `;
      }
      return '';
    }

    function renderList() {
      const filtered = currentFilter === 'all'
        ? allOrders
        : allOrders.filter((o) => (o.status || 'pending') === currentFilter);

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-receipt"></i>
            <p>${t('owner_orders_empty')}</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map((order) => {
        const status = order.status || 'pending';
        const itemsText = (order.items || [])
          .map((i) => `${i.title} × ${i.qty}`)
          .join(', ');
        const actions = actionButtonsHtml(order);
        return `
          <div class="card order-card">
            <div class="order-card-head">
              <div>
                <p class="order-customer">${order.customerName || ''}</p>
                <p class="order-time">${order.phone || ''} · ${formatTime(order.createdAt)}</p>
              </div>
              <span class="status-badge status-${status}">${statusLabels[status] || status}</span>
            </div>
            <p class="order-items-list">${itemsText}</p>
            <p>${order.address || ''}</p>
            ${order.deliveryLocation ? `<p class="order-delivery-note">${order.deliveryLocation === 'outside' ? t('order_delivery_outside') : t('order_delivery_inside')}</p>` : ''}
            <p class="order-total">${t('orders_total')}: ৳${order.totalPrice || 0}</p>
            ${status !== 'cancelled' ? `
              <div class="order-tracking-row">
                <input type="url" class="form-input tracking-input" data-id="${order.id}" placeholder="${t('owner_tracking_placeholder')}" value="${order.trackingLink || ''}">
                <button type="button" class="btn btn-outline btn-sm save-tracking-btn" data-id="${order.id}">${t('owner_save_tracking')}</button>
              </div>
            ` : ''}
            ${actions ? `<div class="order-actions-row">${actions}</div>` : ''}
          </div>
        `;
      }).join('');

      listEl.querySelectorAll('.action-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const next = btn.dataset.next;
          if (next === 'cancelled' && !confirm(t('owner_confirm_cancel'))) return;
          btn.disabled = true;
          try {
            await updateOrder(id, { status: next });
            const order = allOrders.find((o) => o.id === id);
            if (order) order.status = next;
            renderList();
          } catch (err) {
            console.error(err);
            alert(t('owner_update_error'));
            btn.disabled = false;
          }
        });
      });

      listEl.querySelectorAll('.save-tracking-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const input = listEl.querySelector(`.tracking-input[data-id="${id}"]`);
          const link = input.value.trim();
          btn.disabled = true;
          const originalText = btn.textContent;
          try {
            await updateOrder(id, { trackingLink: link });
            const order = allOrders.find((o) => o.id === id);
            if (order) order.trackingLink = link;
            btn.textContent = t('owner_saved');
            setTimeout(() => { btn.textContent = originalText; }, 1500);
          } catch (err) {
            console.error(err);
            alert(t('owner_update_error'));
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    document.getElementById('order-filter-bar').addEventListener('click', (e) => {
      const chip = e.target.closest('.order-filter-chip');
      if (!chip) return;
      document.querySelectorAll('.order-filter-chip').forEach((c) => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      renderList();
    });

    try {
      allOrders = await fetchOrders();
      renderList();
    } catch (err) {
      console.error(err);
      listEl.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>${t('owner_orders_error')}</p></div>`;
    }
  </script>
  <script type="module" src="footer.js"></script>
  <script type="module" src="theme.js"></script>
  <script type="module" src="whatsapp-float.js"></script>
</body>
</html>
