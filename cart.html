<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novaris — কার্ট</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
  <script type="module" src="i18n.js"></script>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">Novaris</a>
      <div class="navbar-links">
        <span id="customer-nav-slot" class="navbar-account"></span>
        <a href="cart.html" class="navbar-cart" data-i18n-aria="nav_cart" aria-label="কার্ট">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 data-i18n="cart_title">আপনার কার্ট</h1>

    <div class="cart-layout" id="cart-layout">
      <div class="card" id="cart-items-card">
        <!-- cart items injected here -->
      </div>

      <div class="card" id="checkout-card">
        <h2 data-i18n="cart_checkout">চেকআউট</h2>
        <div class="cart-summary-row">
          <span data-i18n="cart_subtotal">সাবটোটাল</span>
          <span id="summary-subtotal">৳0</span>
        </div>
        <div class="cart-summary-row" id="summary-delivery-row" style="display:none;">
          <span data-i18n="cart_delivery_charge">ডেলিভারি চার্জ</span>
          <span id="summary-delivery">৳0</span>
        </div>
        <div class="cart-summary-row cart-summary-total">
          <span data-i18n="cart_total">মোট</span>
          <span id="summary-total">৳0</span>
        </div>

        <form id="checkout-form" style="margin-top: 18px;">
          <div class="form-group">
            <label class="form-label" for="cust-name" data-i18n="checkout_name">নাম *</label>
            <input class="form-input" type="text" id="cust-name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="cust-phone" data-i18n="checkout_phone">ফোন নম্বর *</label>
            <input class="form-input" type="tel" id="cust-phone" placeholder="01XXXXXXXXX" required>
            <p class="form-error" id="phone-error" style="display:none;" data-i18n="checkout_phone_error">সঠিক বাংলাদেশি মোবাইল নম্বর দিন</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="cust-address" data-i18n="checkout_address">ঠিকানা *</label>
            <textarea class="form-textarea" id="cust-address" required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="cust-email" data-i18n="checkout_email">ইমেইল (ঐচ্ছিক)</label>
            <input class="form-input" type="email" id="cust-email">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="checkout_delivery_location">ডেলিভারি এলাকা *</label>
            <div class="delivery-options" id="delivery-options">
              <label class="delivery-option">
                <input type="radio" name="delivery-location" value="inside" required>
                <span data-i18n="checkout_delivery_inside">ঢাকার ভেতরে (ফ্রি)</span>
              </label>
              <label class="delivery-option">
                <input type="radio" name="delivery-location" value="outside" required>
                <span data-i18n="checkout_delivery_outside">ঢাকার বাইরে (+৳১২০)</span>
              </label>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="place-order-btn">
            <i class="fa-solid fa-check"></i> <span data-i18n="checkout_place_order">অর্ডার করুন</span>
          </button>
          <p class="form-error" id="order-error" style="display:none;"></p>
        </form>

        <div id="order-confirmation" style="display:none;">
          <div class="empty-state">
            <i class="fa-solid fa-circle-check"></i>
            <p data-i18n="checkout_success_msg2">ধন্যবাদ! আপনার অর্ডার সফলভাবে সম্পন্ন হয়েছে।</p>
            <a href="index.html" class="btn btn-outline" style="margin-top: 10px;" data-i18n="cart_browse">কেনাকাটা চালিয়ে যান</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script type="module">
    import {
      getCart, removeFromCart, updateCartItemQty, getCartTotal, renderCartBadge
    } from './cart.js';
    import { t } from './i18n.js';
    // checkout.js pulls in Firebase, so it's loaded lazily on submit — the
    // cart itself (view/edit/remove) never depends on Firebase being reachable.

    function getSelectedDeliveryLocation() {
      const checked = document.querySelector('input[name="delivery-location"]:checked');
      return checked ? checked.value : null;
    }

    function deliveryChargeFor(location) {
      return location === 'outside' ? 120 : 0;
    }

    function updateSummary() {
      const subtotal = getCartTotal();
      const location = getSelectedDeliveryLocation();
      const deliveryRow = document.getElementById('summary-delivery-row');

      document.getElementById('summary-subtotal').textContent = `৳${subtotal}`;

      if (location === null) {
        deliveryRow.style.display = 'none';
        document.getElementById('summary-total').textContent = `৳${subtotal}`;
      } else {
        const charge = deliveryChargeFor(location);
        deliveryRow.style.display = '';
        document.getElementById('summary-delivery').textContent = `৳${charge}`;
        document.getElementById('summary-total').textContent = `৳${subtotal + charge}`;
      }
    }

    document.querySelectorAll('input[name="delivery-location"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        document.querySelectorAll('.delivery-option').forEach((label) => label.classList.remove('selected'));
        radio.closest('.delivery-option').classList.add('selected');
        updateSummary();
      });
    });

    function renderCart() {
      const cart = getCart();
      const itemsCard = document.getElementById('cart-items-card');
      const checkoutCard = document.getElementById('checkout-card');

      if (cart.length === 0) {
        itemsCard.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-cart-shopping"></i>
            <p>${t('cart_empty')}</p>
            <a href="index.html" class="btn btn-outline" style="margin-top: 10px;">${t('cart_browse_start')}</a>
          </div>
        `;
        checkoutCard.style.display = 'none';
        return;
      }

      checkoutCard.style.display = '';
      itemsCard.innerHTML = `<h2>${t('cart_items_heading').replace('{n}', cart.length)}</h2>` + cart.map((item) => `
        <div class="cart-item" data-item-id="${item.itemId}" data-item-type="${item.itemType}">
          <div>
            <p class="cart-item-title">${item.title}</p>
            <p class="cart-item-price">৳${item.price} × ${item.qty}</p>
          </div>
          <div class="qty-stepper" data-item-id="${item.itemId}" data-item-type="${item.itemType}">
            <button type="button" class="qty-btn qty-minus" aria-label="${t('cart_qty_decrease')}" ${item.qty <= 1 ? 'disabled' : ''}>
              <i class="fa-solid fa-minus"></i>
            </button>
            <span class="qty-value">${item.qty}</span>
            <button type="button" class="qty-btn qty-plus" aria-label="${t('cart_qty_increase')}">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
          <span class="price-current">৳${item.price * item.qty}</span>
          <button class="icon-btn danger remove-btn" data-item-id="${item.itemId}" data-item-type="${item.itemType}" aria-label="${t('cart_remove')}">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');

      itemsCard.querySelectorAll('.qty-minus').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const wrap = e.currentTarget.closest('.qty-stepper');
          const item = getCart().find((i) => i.itemId === wrap.dataset.itemId && i.itemType === wrap.dataset.itemType);
          if (!item || item.qty <= 1) return;
          updateCartItemQty(wrap.dataset.itemId, wrap.dataset.itemType, item.qty - 1);
          renderCart();
        });
      });
      itemsCard.querySelectorAll('.qty-plus').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const wrap = e.currentTarget.closest('.qty-stepper');
          const item = getCart().find((i) => i.itemId === wrap.dataset.itemId && i.itemType === wrap.dataset.itemType);
          if (!item) return;
          updateCartItemQty(wrap.dataset.itemId, wrap.dataset.itemType, item.qty + 1);
          renderCart();
        });
      });
      itemsCard.querySelectorAll('.remove-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          removeFromCart(e.currentTarget.dataset.itemId, e.currentTarget.dataset.itemType);
          renderCart();
        });
      });

      updateSummary();
    }

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();
      const email = document.getElementById('cust-email').value.trim();
      const deliveryLocation = getSelectedDeliveryLocation();
      const phoneError = document.getElementById('phone-error');
      const orderError = document.getElementById('order-error');

      const validPhone = /^01[3-9]\d{8}$/.test(phone);
      phoneError.style.display = validPhone ? 'none' : 'block';
      if (!validPhone) return;

      // Belt-and-braces: the radios are already `required`, so the browser
      // won't let the form submit without one selected, but guard anyway.
      if (!deliveryLocation) return;

      const btn = document.getElementById('place-order-btn');
      btn.disabled = true;
      btn.textContent = t('checkout_sending');
      orderError.style.display = 'none';

      try {
        const { submitOrder } = await import('./checkout.js');
        await submitOrder({ name, phone, address, email, deliveryLocation });
        document.getElementById('checkout-form').style.display = 'none';
        document.getElementById('order-confirmation').style.display = 'block';
      } catch (err) {
        console.error(err);
        orderError.textContent = t('checkout_error');
        orderError.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check"></i> ${t('checkout_place_order')}`;
      }
    });

    renderCart();
    renderCartBadge();
  </script>
  <script type="module" src="customer-nav.js"></script>
  <script type="module" src="footer.js"></script>
  <script type="module" src="whatsapp-float.js"></script>
</body>
</html>
